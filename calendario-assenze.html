 <!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Assenze — MyLogAdmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:      #080d18;
    --panel:   #141d2e;
    --panel2:  #182238;
    --line:    #1f2d45;
    --ink:     #f0f4ff;
    --muted:   #6b7a99;
    --yellow:  #facc15;
    --yellow-dim: rgba(250,204,21,.14);

    --c-ferie:     #22c55e;
    --c-permesso:  #facc15;
    --c-malattia:  #a855f7;
    --c-richiesta: #3b82f6;
    --c-rifiutato: #ef4444;
    --c-blocco:    #e2e8f0;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Syne',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100dvh;
    padding:28px clamp(20px, 4vw, 64px) 90px;
  }
  .wrap{width:100%; max-width:1800px; margin:0 auto;}

  /* ── Topbar ── */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px; gap:16px;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-size:.72rem;
    color:var(--muted); text-decoration:none;
    letter-spacing:.05em; text-transform:uppercase;
    transition:color .15s;
  }
  .back-link:hover{ color:var(--yellow); }
  .topbar-right{
    font-family:'JetBrains Mono',monospace; font-size:.72rem;
    color:var(--muted); text-align:right; line-height:1.5;
  }
  .topbar-right .clock{color:var(--ink); font-weight:600; font-size:.85rem;}

  /* ── Header modulo ── */
  .module-head{
    display:flex; align-items:center; gap:14px;
    margin:22px 0 24px; flex-wrap:wrap;
  }
  .module-icon{
    width:48px; height:48px; border-radius:12px;
    background:var(--yellow-dim);
    display:flex; align-items:center; justify-content:center;
    color:var(--yellow); flex-shrink:0;
  }
  .module-icon svg{ width:26px; height:26px; }
  .module-head .eyebrow{
    font-size:.62rem; font-weight:600; letter-spacing:.22em;
    text-transform:uppercase; color:var(--muted); margin-bottom:3px;
  }
  .module-head .title{ font-size:1.4rem; font-weight:700; }
  .btn-nuova{
    margin-left:auto; display:inline-flex; align-items:center; gap:8px;
    background:var(--yellow); color:#161200; border:none; border-radius:10px;
    padding:11px 18px; font-family:'Syne',sans-serif; font-weight:700; font-size:.85rem;
    cursor:pointer; transition:filter .15s;
  }
  .btn-nuova:hover{ filter:brightness(1.08); }

  /* ── Calendario ── */
  .cal-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 26px 26px;
    position:relative;
  }
  .cal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; flex-wrap:wrap; gap:12px;
  }
  .cal-nav{ display:flex; align-items:center; gap:8px; }
  .cal-nav button{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel2); color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:.95rem;
    transition:border-color .15s, color .15s;
  }
  .cal-nav button:hover{ border-color:var(--yellow); color:var(--yellow); }
  .cal-nav .cal-month-label{
    font-family:'JetBrains Mono',monospace; font-size:.95rem; color:var(--ink);
    min-width:150px; text-align:center; text-transform:capitalize;
  }
  .cal-today-btn{
    font-size:.65rem; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:var(--yellow);
    background:var(--yellow-dim); border:1px solid rgba(250,204,21,.25);
    border-radius:8px; padding:8px 12px; cursor:pointer;
    font-family:'Syne',sans-serif; transition:filter .15s;
  }
  .cal-today-btn:hover{ filter:brightness(1.1); }
  .cal-legend{ display:flex; gap:14px; flex-wrap:wrap; }
  .cal-legend span{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.7rem; color:var(--muted);
    font-family:'JetBrains Mono',monospace;
  }
  .cal-legend i{ width:9px; height:9px; border-radius:3px; display:inline-block; }

  /* ── Griglia mensile ── */
  .cal-grid-head{
    display:grid; grid-template-columns:repeat(7,1fr);
    gap:8px; margin-bottom:8px;
  }
  .cal-dow{
    text-align:center; font-size:.7rem; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); padding-bottom:4px;
  }

  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr);
    gap:8px;
  }
  .cal-day{
    position:relative;
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:11px;
    min-height:104px;
    padding:8px 8px 7px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    overflow:hidden;
  }
  .cal-day:hover{ border-color:var(--yellow); }
  .cal-day.out{ opacity:.35; }
  .cal-day.out:hover{ border-color:var(--line); }
  .cal-day.today{ border-color:var(--yellow); }
  .cal-day-num{
    font-family:'JetBrains Mono',monospace; font-size:.8rem;
    color:var(--muted); margin-bottom:6px; display:block;
  }
  .cal-day.today .cal-day-num{ color:var(--yellow); font-weight:800; }

  .cal-events{ display:flex; flex-direction:column; gap:4px; }
  .cal-event{
    border-radius:6px; padding:4px 8px;
    font-size:.7rem; font-weight:700; color:#0b0e14;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer; transition:filter .15s, transform .1s;
  }
  .cal-event:hover{ filter:brightness(1.12); transform:translateY(-1px); }
  .cal-event.stato-richiesta{ background:var(--c-richiesta); color:#eaf1ff; }
  .cal-event.tipo-ferie{ background:var(--c-ferie); }
  .cal-event.tipo-permesso{ background:var(--c-permesso); }
  .cal-event.tipo-malattia{ background:var(--c-malattia); color:#fff; }
  .cal-event.stato-rifiutato{ background:transparent; border:1.5px dashed var(--c-rifiutato); color:var(--c-rifiutato); text-decoration:line-through; }
  .cal-event.tipo-blocco{ background:var(--c-blocco); color:#1a2438; }
  .cal-event.altri{
    background:rgba(255,255,255,.08); color:var(--muted);
    font-weight:700; text-align:center;
  }

  .cal-loading, .cal-error{
    text-align:center; padding:40px 20px; color:var(--muted);
    font-family:'JetBrains Mono',monospace; font-size:.82rem;
    grid-column:1 / -1;
  }
  .cal-error{ color:#fca5a5; }
  .cal-error button{
    margin-top:10px; background:transparent; border:1px solid #fca5a5; color:#fca5a5;
    border-radius:8px; padding:6px 16px; font-family:'Syne',sans-serif; font-weight:600; cursor:pointer;
  }

  /* ── Popup giorno ── */
  .day-popup{
    display:none; position:fixed; z-index:300;
    background:var(--panel2); border:1px solid var(--line); border-radius:16px;
    padding:16px; min-width:230px; max-width:300px;
    box-shadow:0 8px 32px rgba(0,0,0,.6);
  }
  .day-popup.open{ display:block; }
  .day-popup-title{
    font-size:.7rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:10px; padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .day-popup-item{
    display:flex; align-items:center; gap:9px; padding:8px 0;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .day-popup-item:hover{ opacity:.8; }
  .day-popup-item:last-of-type{ border-bottom:none; }
  .day-popup-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .day-popup-name{ font-size:.82rem; font-weight:700; color:var(--ink); }
  .day-popup-label{ font-size:.68rem; color:var(--muted); margin-top:1px; }
  .day-popup-add{
    margin-top:10px; width:100%; padding:9px; border-radius:8px;
    background:var(--yellow-dim); border:1px solid rgba(250,204,21,.25);
    color:var(--yellow); font-family:'Syne',sans-serif; font-weight:700;
    font-size:.75rem; cursor:pointer;
  }
  .day-popup-close{
    margin-top:8px; width:100%; padding:8px; border-radius:8px;
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    font-family:'Syne',sans-serif; font-weight:700; font-size:.75rem; cursor:pointer;
  }
  .day-popup-close:hover{ border-color:var(--muted); color:var(--ink); }

  /* ── FAB ── */
  .fab{
    position:fixed; bottom:26px; right:26px; z-index:60;
    width:56px; height:56px; border-radius:50%; border:none;
    background:var(--yellow); color:#161200; font-size:1.6rem; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 22px rgba(250,204,21,.4); transition:transform .15s;
  }
  .fab:hover{ transform:scale(1.07); }
  .fab:active{ transform:scale(.94); }

  /* ── Modal generico (dettaglio + form) ── */
  .modal-overlay{
    display:none; position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,.6);
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--panel2); border:1px solid var(--line); border-radius:16px;
    padding:24px 26px; max-width:420px; width:100%;
    max-height:88dvh; overflow-y:auto;
  }

  /* dettaglio */
  .cal-modal-tipo{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    padding:5px 12px; border-radius:20px; margin-bottom:14px; color:#0b0e14;
  }
  .cal-modal-nome{ font-size:1.25rem; font-weight:700; margin-bottom:16px; }
  .cal-modal-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-top:1px solid var(--line);
    font-size:.85rem;
  }
  .cal-modal-row .k{ color:var(--muted); }
  .cal-modal-row .v{ font-family:'JetBrains Mono',monospace; }
  .cal-modal-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
  .cal-modal-actions button{
    flex:1; min-width:100px; padding:10px; border-radius:10px;
    font-family:'Syne',sans-serif; font-weight:700; font-size:.78rem; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:var(--ink);
    transition:border-color .15s, background .15s;
  }
  .btn-approva{ border-color:var(--c-ferie); color:#86efac; }
  .btn-approva:hover{ background:rgba(34,197,94,.12); }
  .btn-rifiuta{ border-color:var(--c-rifiutato); color:#fca5a5; }
  .btn-rifiuta:hover{ background:rgba(239,68,68,.12); }
  .btn-modifica{ border-color:var(--yellow); color:var(--yellow); }
  .btn-modifica:hover{ background:rgba(250,204,21,.1); }
  .btn-elimina{ border-color:var(--c-rifiutato); color:#fca5a5; }
  .btn-elimina:hover{ background:rgba(239,68,68,.12); }
  .btn-chiudi-modal{
    margin-top:8px; width:100%; padding:10px; border-radius:10px;
    border:1px solid var(--line); background:transparent; color:var(--muted);
    font-family:'Syne',sans-serif; font-weight:600; cursor:pointer;
  }
  .btn-chiudi-modal:hover{ border-color:var(--muted); color:var(--ink); }

  /* form nuova/modifica */
  .form-title{ font-size:1.05rem; font-weight:700; margin-bottom:18px; }
  .form-field{ margin-bottom:16px; }
  .form-label{
    display:block; font-size:.65rem; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.1em; margin-bottom:7px;
  }
  .form-select, .form-date{
    width:100%; padding:11px 12px; border-radius:9px;
    border:1.5px solid var(--line); background:var(--panel);
    color:var(--ink); font-family:'Syne',sans-serif; font-size:.85rem;
  }
  .tipo-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tipo-btn{
    padding:11px 6px; border-radius:9px; border:1.5px solid var(--line);
    background:var(--panel); color:var(--muted); font-family:'Syne',sans-serif;
    font-size:.78rem; font-weight:700; cursor:pointer; text-align:center;
    transition:all .15s;
  }
  .tipo-btn.active-ferie{ border-color:var(--c-ferie); background:rgba(34,197,94,.12); color:#86efac; }
  .tipo-btn.active-permesso{ border-color:var(--c-permesso); background:rgba(250,204,21,.12); color:#fde68a; }
  .tipo-btn.active-malattia{ border-color:var(--c-malattia); background:rgba(168,85,247,.14); color:#d8b4fe; }
  .tipo-btn.active-blocco{ border-color:var(--c-blocco); background:rgba(226,232,240,.14); color:#e2e8f0; }
  .date-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form-err{
    font-size:.78rem; color:#fca5a5; background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.3); border-radius:8px; padding:9px 12px;
    margin-bottom:14px; display:none;
  }
  .form-err.visible{ display:block; }
  .btn-submit-form{
    width:100%; padding:13px; border-radius:10px; border:none;
    background:var(--yellow); color:#161200; font-family:'Syne',sans-serif;
    font-weight:700; font-size:.9rem; cursor:pointer; margin-top:6px;
  }
  .btn-submit-form:disabled{ opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="back-link" href="home.html">← Home</a>
    <div class="topbar-right">
      <div class="clock" id="clock">--:--:--</div>
      <div id="dateLabel">—</div>
    </div>
  </div>

  <div class="module-head">
    <div class="module-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="5" width="17" height="15" rx="2"></rect>
        <path d="M3.5 9.5h17"></path>
        <path d="M8 3.5v3M16 3.5v3"></path>
        <path d="M8.5 13.5l2.2 2.2 4.3-4.3"></path>
      </svg>
    </div>
    <div>
      <div class="eyebrow">Modulo · AS</div>
      <div class="title">Assenze</div>
    </div>
    <button class="btn-nuova" onclick="apriFormNuova()">＋ Nuova assenza</button>
  </div>

  <div class="cal-panel">
    <div class="cal-head">
      <div class="cal-nav">
        <button id="calPrev" aria-label="Mese precedente">←</button>
        <span class="cal-month-label" id="calMonthLabel">—</span>
        <button id="calNext" aria-label="Mese successivo">→</button>
        <button class="cal-today-btn" id="calToday">OGGI</button>
      </div>
      <div class="cal-legend">
        <span><i style="background:#3b82f6"></i>Richiesta</span>
        <span><i style="background:#22c55e"></i>Ferie</span>
        <span><i style="background:#facc15"></i>Permesso</span>
        <span><i style="background:#a855f7"></i>Malattia</span>
        <span><i style="background:#ef4444"></i>Rifiutato</span>
        <span><i style="background:#e2e8f0"></i>Blocco</span>
      </div>
    </div>

    <div class="cal-grid-head">
      <div class="cal-dow">Lun</div>
      <div class="cal-dow">Mar</div>
      <div class="cal-dow">Mer</div>
      <div class="cal-dow">Gio</div>
      <div class="cal-dow">Ven</div>
      <div class="cal-dow">Sab</div>
      <div class="cal-dow">Dom</div>
    </div>

    <div class="cal-grid" id="calGrid"><div class="cal-loading">Caricamento assenze…</div></div>
  </div>
</div>

<button class="fab" onclick="apriFormNuova()" title="Nuova assenza">＋</button>

<!-- Popup giorno -->
<div class="day-popup" id="dayPopup">
  <div class="day-popup-title" id="dayPopupTitle"></div>
  <div id="dayPopupList"></div>
  <button class="day-popup-add" id="dayPopupAdd">＋ Nuova assenza in questo giorno</button>
  <button class="day-popup-close" onclick="chiudiDayPopup()">Chiudi</button>
</div>

<!-- Modal dettaglio assenza -->
<div class="modal-overlay" id="calModalOverlay" onclick="if(event.target===this) chiudiCalModal()">
  <div class="modal-box">
    <div class="cal-modal-tipo" id="calModalTipo"></div>
    <div class="cal-modal-nome" id="calModalNome"></div>
    <div class="cal-modal-row"><span class="k">Dal</span><span class="v" id="calModalDal"></span></div>
    <div class="cal-modal-row"><span class="k">Al</span><span class="v" id="calModalAl"></span></div>
    <div class="cal-modal-row"><span class="k">Giorni</span><span class="v" id="calModalGiorni"></span></div>
    <div class="cal-modal-row"><span class="k">Stato</span><span class="v" id="calModalStato"></span></div>
    <div class="cal-modal-actions" id="calModalActions"><!-- generato via JS --></div>
    <button class="btn-chiudi-modal" onclick="chiudiCalModal()">Chiudi</button>
  </div>
</div>

<!-- Modal form nuova/modifica assenza -->
<div class="modal-overlay" id="formOverlay" onclick="if(event.target===this) chiudiForm()">
  <div class="modal-box">
    <div class="form-title" id="formTitle">Nuova assenza</div>
    <div class="form-err" id="formErr"></div>

    <div class="form-field" id="fieldDriver">
      <label class="form-label">Driver</label>
      <select class="form-select" id="formDriver"><option value="">— Seleziona —</option></select>
    </div>

    <div class="form-field">
      <label class="form-label">Tipo</label>
      <div class="tipo-grid" style="grid-template-columns:repeat(4,1fr)">
        <button type="button" class="tipo-btn" id="btnTipoFerie" onclick="selTipoForm('Ferie')">Ferie</button>
        <button type="button" class="tipo-btn" id="btnTipoPermesso" onclick="selTipoForm('Permesso')">Permesso</button>
        <button type="button" class="tipo-btn" id="btnTipoMalattia" onclick="selTipoForm('Malattia')">Malattia</button>
        <button type="button" class="tipo-btn" id="btnTipoBlocco" onclick="selTipoForm('Blocco')">Blocco</button>
      </div>
    </div>

    <div class="form-field">
      <label class="form-label">Periodo</label>
      <div class="date-row">
        <input type="date" class="form-date" id="formDal">
        <input type="date" class="form-date" id="formAl">
      </div>
    </div>

    <button class="btn-submit-form" id="btnSubmitForm" onclick="submitForm()" disabled>Salva</button>
    <button class="btn-chiudi-modal" onclick="chiudiForm()">Annulla</button>
  </div>
</div>

<script>
  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent = d.toLocaleTimeString('it-IT');
    document.getElementById('dateLabel').textContent = d.toLocaleDateString('it-IT', { weekday:'short', day:'2-digit', month:'short' });
  }
  tick(); setInterval(tick, 1000);

  // ── Config ────────────────────────────────────────────────
  const API       = 'https://giro.groupmylogistich.workers.dev';
  const ADMIN_KEY = 'mlg-admin-8f3k2q'; // deve combaciare con ADMIN_KEY nello script Apps Script

  function apiCall(qs) {
    return new Promise((resolve, reject) => {
      const cb    = '_cb' + Date.now() + Math.random().toString(36).slice(2);
      const tag   = document.createElement('script');
      const timer = setTimeout(() => { delete window[cb]; tag.remove(); reject(new Error('Timeout')); }, 25000);
      window[cb] = data => { clearTimeout(timer); delete window[cb]; tag.remove(); resolve(data); };
      tag.onerror = () => { clearTimeout(timer); delete window[cb]; tag.remove(); reject(new Error('Errore di rete')); };
      tag.src = API + '?' + qs + '&callback=' + cb;
      document.head.appendChild(tag);
    });
  }

  let tutteAssenze = [];
  let listaDrivers = [];
  let calAnno  = new Date().getFullYear();
  let calMese  = new Date().getMonth();
  let modModifica = null; // id dell'assenza in modifica, o null se è una nuova
  let tipoFormSel = '';

  const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  function calParseIt(s){ // "dd/mm/yyyy" -> Date
    if (!s) return null;
    const [d,m,y] = s.split('/').map(Number);
    return new Date(y, m-1, d);
  }
  function calFmtIt(d){ return d.toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', year:'numeric' }); }
  function dateToISO(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  async function caricaTutto(){
    document.getElementById('calGrid').innerHTML = '<div class="cal-loading">Caricamento assenze…</div>';
    try {
      const [resA, resD] = await Promise.all([
        apiCall('action=assenze_tutte'),
        apiCall('action=driver_lista'),
      ]);
      tutteAssenze = (resA && resA.assenze) || [];
      listaDrivers = (resD && resD.drivers) || [];
      popolaDropdownDrivers();
      renderCalendario();
    } catch(e) {
      document.getElementById('calGrid').innerHTML =
        '<div class="cal-error">⚠️ Impossibile caricare le assenze.<br>' + e.message + '<br>' +
        '<button onclick="caricaTutto()">Riprova</button></div>';
    }
  }

  function popolaDropdownDrivers(){
    const sel = document.getElementById('formDriver');
    sel.innerHTML = '<option value="">— Seleziona —</option>';
    listaDrivers.forEach(d => {
      const o = document.createElement('option');
      o.value = d.id; o.textContent = d.nome || d.id;
      sel.appendChild(o);
    });
  }

  // ── Colore/etichetta in base a stato + tipo ──
  function classeEvento(a){
    if (a.stato === 'Richiesta')  return 'stato-richiesta';
    if (a.stato === 'Rifiutato')  return 'stato-rifiutato';
    const t = (a.tipo || '').toLowerCase();
    if (t === 'ferie')    return 'tipo-ferie';
    if (t === 'permesso') return 'tipo-permesso';
    if (t === 'malattia') return 'tipo-malattia';
    if (t === 'blocco')   return 'tipo-blocco';
    return '';
  }

  // ── Calendario a griglia mensile ──
  function renderCalendario(){
    const primoDelMese  = new Date(calAnno, calMese, 1);
    const ultimoDelMese = new Date(calAnno, calMese + 1, 0);

    const inizioGriglia = new Date(primoDelMese);
    const offsetInizio = (primoDelMese.getDay() + 6) % 7;
    inizioGriglia.setDate(primoDelMese.getDate() - offsetInizio);

    const fineGriglia = new Date(ultimoDelMese);
    const offsetFine = (7 - ((ultimoDelMese.getDay() + 6) % 7) - 1);
    fineGriglia.setDate(ultimoDelMese.getDate() + offsetFine);

    document.getElementById('calMonthLabel').textContent =
      primoDelMese.toLocaleDateString('it-IT', { month:'long', year:'numeric' });

    const oggi = new Date(); oggi.setHours(0,0,0,0);
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    const eventiParsati = tutteAssenze.map(a => ({
      ...a, dalD: calParseIt(a.dal), alD: calParseIt(a.al)
    })).filter(a => a.dalD && a.alD);

    let cursore = new Date(inizioGriglia);
    while (cursore <= fineGriglia) {
      const data = new Date(cursore);
      const el = document.createElement('div');
      el.className = 'cal-day';
      if (data.getMonth() !== calMese) el.classList.add('out');
      if (data.getTime() === oggi.getTime()) el.classList.add('today');

      const numEl = document.createElement('div');
      numEl.className = 'cal-day-num';
      numEl.textContent = data.getDate();
      el.appendChild(numEl);

      const eventiGiorno = eventiParsati
        .filter(a => a.dalD <= data && a.alD >= data)
        .sort((a,b) => a.dalD - b.dalD);

      const evWrap = document.createElement('div');
      evWrap.className = 'cal-events';
      eventiGiorno.slice(0, 3).forEach(ev => {
        const chip = document.createElement('div');
        chip.className = 'cal-event ' + classeEvento(ev);
        chip.textContent = (ev.nomeDriver || ev.driver || ev.tipo);
        chip.onclick = (e) => { e.stopPropagation(); apriCalModal(ev); };
        evWrap.appendChild(chip);
      });
      if (eventiGiorno.length > 3) {
        const more = document.createElement('div');
        more.className = 'cal-event altri';
        more.textContent = '+' + (eventiGiorno.length - 3) + ' altri';
        evWrap.appendChild(more);
      }
      el.appendChild(evWrap);

      el.addEventListener('click', () => apriDayPopup(data, eventiGiorno));

      grid.appendChild(el);
      cursore.setDate(cursore.getDate() + 1);
    }
  }

  // ── Popup giorno ──
  let dataPopupCorrente = null;
  function apriDayPopup(data, eventiGiorno){
    dataPopupCorrente = data;
    document.getElementById('dayPopupTitle').textContent =
      data.getDate() + ' ' + MESI[data.getMonth()] + ' ' + data.getFullYear();

    const listEl = document.getElementById('dayPopupList');
    if (!eventiGiorno.length) {
      listEl.innerHTML = '<div style="font-size:.78rem;color:var(--muted);padding:6px 0 2px">Nessuna assenza in questo giorno.</div>';
    } else {
      listEl.innerHTML = eventiGiorno.map((ev, i) => {
        const col   = ev.stato === 'Richiesta' ? '#3b82f6' : ev.stato === 'Rifiutato' ? '#ef4444' :
                      ({ 'Ferie':'#22c55e','Permesso':'#facc15','Malattia':'#a855f7','Blocco':'#e2e8f0' })[ev.tipo] || '#6b7a99';
        const label = ev.stato === 'Richiesta' ? 'In attesa di approvazione' : ev.stato === 'Rifiutato' ? 'Rifiutato' : ev.stato;
        return '<div class="day-popup-item" data-idx="' + i + '">' +
          '<div class="day-popup-dot" style="background:' + col + '"></div>' +
          '<div><div class="day-popup-name">' + (ev.nomeDriver || ev.driver) + ' — ' + ev.tipo + '</div>' +
          '<div class="day-popup-label">' + label + '</div></div></div>';
      }).join('');
      listEl.querySelectorAll('.day-popup-item').forEach(item => {
        item.onclick = () => {
          const idx = Number(item.getAttribute('data-idx'));
          chiudiDayPopup();
          apriCalModal(eventiGiorno[idx]);
        };
      });
    }

    document.getElementById('dayPopupAdd').onclick = () => {
      chiudiDayPopup();
      apriFormNuova();
      const iso = dateToISO(data);
      document.getElementById('formDal').value = iso;
      document.getElementById('formAl').value = iso;
      aggiornaSubmitForm();
    };

    const popup = document.getElementById('dayPopup');
    popup.classList.add('open');
    // centra il popup nello schermo (semplice e affidabile su ogni dispositivo)
    popup.style.left = '50%';
    popup.style.top = '50%';
    popup.style.transform = 'translate(-50%, -50%)';

    setTimeout(() => {
      document.addEventListener('click', chiudiDayPopupOutside);
    }, 50);
  }
  function chiudiDayPopupOutside(e){
    const popup = document.getElementById('dayPopup');
    if (!popup.contains(e.target)) chiudiDayPopup();
  }
  function chiudiDayPopup(){
    document.getElementById('dayPopup').classList.remove('open');
    document.removeEventListener('click', chiudiDayPopupOutside);
  }

  // ── Modal dettaglio + azioni (approva/rifiuta/modifica/elimina) ──
  let evCorrente = null;
  const COLORI_TIPO = { 'Ferie':'#22c55e', 'Permesso':'#facc15', 'Malattia':'#a855f7', 'Blocco':'#e2e8f0' };

  function apriCalModal(ev){
    evCorrente = ev;
    const tipoEl = document.getElementById('calModalTipo');
    if (ev.stato === 'Richiesta') { tipoEl.textContent = 'Richiesta'; tipoEl.style.background = '#3b82f6'; tipoEl.style.color = '#fff'; }
    else if (ev.stato === 'Rifiutato') { tipoEl.textContent = 'Rifiutato'; tipoEl.style.background = '#ef4444'; tipoEl.style.color = '#fff'; }
    else { tipoEl.textContent = ev.tipo; tipoEl.style.background = COLORI_TIPO[ev.tipo] || '#6b7a99'; tipoEl.style.color = '#0b0e14'; }

    document.getElementById('calModalNome').textContent = ev.nomeDriver || ev.driver;
    document.getElementById('calModalDal').textContent = ev.dal;
    document.getElementById('calModalAl').textContent = ev.al;
    document.getElementById('calModalGiorni').textContent = ev.giorni;
    document.getElementById('calModalStato').textContent = ev.stato;

    const az = document.getElementById('calModalActions');
    az.innerHTML = '';
    if (ev.stato === 'Richiesta') {
      az.innerHTML += '<button class="btn-approva" onclick="azioneStato(\'Approvato\')">✓ Approva</button>';
      az.innerHTML += '<button class="btn-rifiuta" onclick="azioneStato(\'Rifiutato\')">✕ Rifiuta</button>';
    }
    az.innerHTML += '<button class="btn-modifica" onclick="apriFormModifica()">✎ Modifica</button>';
    az.innerHTML += '<button class="btn-elimina" onclick="eliminaAssenza()">🗑 Elimina</button>';

    document.getElementById('calModalOverlay').classList.add('open');
  }
  function chiudiCalModal(){
    document.getElementById('calModalOverlay').classList.remove('open');
    evCorrente = null;
  }

  async function azioneStato(nuovoStato){
    if (!evCorrente) return;
    try {
      const res = await apiCall('action=assenze_admin_update&id=' + encodeURIComponent(evCorrente.id) +
        '&stato=' + encodeURIComponent(nuovoStato) + '&key=' + encodeURIComponent(ADMIN_KEY));
      if (res.ok) {
        chiudiCalModal();
        await caricaTutto();
      } else {
        alert(res.errore || 'Errore aggiornamento.');
      }
    } catch(e) { alert('Errore di connessione.'); }
  }

  async function eliminaAssenza(){
    if (!evCorrente) return;
    if (!confirm('Eliminare questa assenza di ' + (evCorrente.nomeDriver || evCorrente.driver) + '?')) return;
    try {
      const res = await apiCall('action=assenze_admin_delete&id=' + encodeURIComponent(evCorrente.id) +
        '&key=' + encodeURIComponent(ADMIN_KEY));
      if (res.ok) {
        chiudiCalModal();
        await caricaTutto();
      } else {
        alert(res.errore || 'Errore eliminazione.');
      }
    } catch(e) { alert('Errore di connessione.'); }
  }

  // ── Form nuova / modifica ──
  function resetForm(){
    modModifica = null;
    tipoFormSel = '';
    document.getElementById('formTitle').textContent = 'Nuova assenza';
    document.getElementById('formDriver').value = '';
    document.getElementById('formDriver').disabled = false;
    document.getElementById('formDal').value = '';
    document.getElementById('formAl').value = '';
    document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active-ferie','active-permesso','active-malattia','active-blocco'));
    document.getElementById('fieldDriver').style.display = 'block';
    document.getElementById('formErr').classList.remove('visible');
    aggiornaSubmitForm();
  }

  function apriFormNuova(){
    resetForm();
    document.getElementById('formOverlay').classList.add('open');
  }

  function apriFormModifica(){
    if (!evCorrente) return;
    resetForm();
    modModifica = evCorrente.id;
    document.getElementById('formTitle').textContent = 'Modifica assenza';
    document.getElementById('formDriver').value = evCorrente.driver;
    document.getElementById('formDriver').disabled = true; // non si cambia driver in modifica
    const dalD = calParseIt(evCorrente.dal), alD = calParseIt(evCorrente.al);
    if (dalD) document.getElementById('formDal').value = dateToISO(dalD);
    if (alD)  document.getElementById('formAl').value  = dateToISO(alD);
    selTipoForm(evCorrente.tipo);
    chiudiCalModal();
    document.getElementById('formOverlay').classList.add('open');
  }

  function chiudiForm(){
    document.getElementById('formOverlay').classList.remove('open');
  }

  function selTipoForm(tipo){
    tipoFormSel = tipo;
    document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active-ferie','active-permesso','active-malattia','active-blocco'));
    if (tipo === 'Ferie')    document.getElementById('btnTipoFerie').classList.add('active-ferie');
    if (tipo === 'Permesso') document.getElementById('btnTipoPermesso').classList.add('active-permesso');
    if (tipo === 'Malattia') document.getElementById('btnTipoMalattia').classList.add('active-malattia');
    if (tipo === 'Blocco')   document.getElementById('btnTipoBlocco').classList.add('active-blocco');

    // Un Blocco non è legato a un driver specifico: nascondo il campo
    const campoDriver = document.getElementById('fieldDriver');
    if (tipo === 'Blocco') { campoDriver.style.display = 'none'; document.getElementById('formDriver').value = ''; }
    else if (!modModifica) { campoDriver.style.display = 'block'; }

    aggiornaSubmitForm();
  }

  document.getElementById('formDriver').addEventListener('change', aggiornaSubmitForm);
  document.getElementById('formDal').addEventListener('change', aggiornaSubmitForm);
  document.getElementById('formAl').addEventListener('change', aggiornaSubmitForm);

  function aggiornaSubmitForm(){
    const driverOk = tipoFormSel === 'Blocco' || modModifica || document.getElementById('formDriver').value;
    const ok = driverOk && tipoFormSel && document.getElementById('formDal').value && document.getElementById('formAl').value;
    document.getElementById('btnSubmitForm').disabled = !ok;
  }

  async function submitForm(){
    const dal = document.getElementById('formDal').value;
    const al  = document.getElementById('formAl').value;
    if (al < dal) {
      document.getElementById('formErr').textContent = 'La data "Al" non può precedere la data "Dal".';
      document.getElementById('formErr').classList.add('visible');
      return;
    }
    const giorni = Math.round((new Date(al) - new Date(dal)) / 86400000) + 1;
    document.getElementById('formErr').classList.remove('visible');
    document.getElementById('btnSubmitForm').disabled = true;

    try {
      let res;
      if (modModifica) {
        res = await apiCall('action=assenze_admin_update&id=' + encodeURIComponent(modModifica) +
          '&tipo=' + encodeURIComponent(tipoFormSel) +
          '&dal=' + encodeURIComponent(dal) + '&al=' + encodeURIComponent(al) +
          '&giorni=' + giorni + '&key=' + encodeURIComponent(ADMIN_KEY));
      } else {
        const driverId = tipoFormSel === 'Blocco' ? '' : document.getElementById('formDriver').value;
        res = await apiCall('action=assenze_admin_add&driver=' + encodeURIComponent(driverId) +
          '&tipo=' + encodeURIComponent(tipoFormSel) + '&tipoPermesso=' +
          '&dal=' + encodeURIComponent(dal) + '&al=' + encodeURIComponent(al) +
          '&giorni=' + giorni + '&key=' + encodeURIComponent(ADMIN_KEY));
      }
      if (res.ok) {
        chiudiForm();
        await caricaTutto();
      } else {
        document.getElementById('formErr').textContent = res.errore || 'Errore salvataggio.';
        document.getElementById('formErr').classList.add('visible');
        document.getElementById('btnSubmitForm').disabled = false;
      }
    } catch(e) {
      document.getElementById('formErr').textContent = 'Errore di connessione. Riprova.';
      document.getElementById('formErr').classList.add('visible');
      document.getElementById('btnSubmitForm').disabled = false;
    }
  }

  document.getElementById('calPrev').onclick = () => {
    calMese--; if (calMese < 0) { calMese = 11; calAnno--; }
    renderCalendario();
  };
  document.getElementById('calNext').onclick = () => {
    calMese++; if (calMese > 11) { calMese = 0; calAnno++; }
    renderCalendario();
  };
  document.getElementById('calToday').onclick = () => {
    calAnno = new Date().getFullYear();
    calMese = new Date().getMonth();
    renderCalendario();
  };

  caricaTutto();
</script>
</body>
</html>
