<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Anagrafica Driver — MyLogAdmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:      #080d18;
    --panel:   #141d2e;
    --panel2:  #182238;
    --panel3:  #1c2740;
    --line:    #1f2d45;
    --line2:   #263548;
    --ink:     #f0f4ff;
    --muted:   #6b7a99;
    --dim:     #3a4a6b;
    --yellow:  #facc15;
    --yellow-dim: rgba(250,204,21,.14);
    --green:   #22c55e;
    --red:     #ef4444;
    --blue:    #3b82f6;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Syne',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100dvh;
  }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:3px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-size:.72rem;
    color:var(--muted); text-decoration:none;
    letter-spacing:.05em; text-transform:uppercase;
  }
  .back-link:hover{ color:var(--yellow); }
  .topbar-title{ font-size:1.1rem; font-weight:800; }
  .topbar-right{
    font-family:'JetBrains Mono',monospace; font-size:.7rem;
    color:var(--muted); display:flex; align-items:center; gap:10px;
  }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; }
  .sync-dot.stale{ background:var(--yellow); }

  .layout{
    display:grid;
    grid-template-columns: 340px 1fr;
    height:calc(100dvh - 57px);
  }
  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; height:auto; }
    .col-left{ max-height:50dvh; }
  }

  .col-left{
    background:var(--panel);
    border-right:1px solid var(--line);
    overflow-y:auto;
    display:flex; flex-direction:column;
  }
  .search-box{
    padding:14px; border-bottom:1px solid var(--line); position:sticky; top:0;
    background:var(--panel); z-index:5;
  }
  .search-input{
    width:100%; padding:10px 12px; border-radius:9px;
    border:1.5px solid var(--line2); background:var(--panel2);
    color:var(--ink); font-family:'Syne',sans-serif; font-size:.85rem;
  }
  .search-input::placeholder{ color:var(--dim); }
  .driver-list{ padding:8px; flex:1; }
  .driver-card{
    padding:12px 14px; border-radius:10px; margin-bottom:6px;
    cursor:pointer; border:1px solid transparent;
    transition:background .12s, border-color .12s;
  }
  .driver-card:hover{ background:var(--panel2); }
  .driver-card.active{ background:var(--yellow-dim); border-color:rgba(250,204,21,.35); }
  .dc-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .dc-nome{ font-size:.85rem; font-weight:700; color:var(--ink); }
  .dc-id{ font-family:'JetBrains Mono',monospace; font-size:.62rem; color:var(--dim); }
  .dc-badges{ display:flex; gap:5px; flex-wrap:wrap; }
  .dc-badge{
    font-size:.58rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:2px 7px; border-radius:10px;
  }
  .dc-badge.occ{ background:rgba(239,68,68,.15); color:#fca5a5; }
  .dc-badge.lib{ background:rgba(34,197,94,.15); color:#86efac; }
  .dc-badge.dip{ background:rgba(59,130,246,.12); color:#93c5fd; }

  .col-right{ overflow-y:auto; padding:22px 28px 60px; }
  .empty-state{
    display:flex; align-items:center; justify-content:center;
    height:100%; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:.85rem;
    text-align:center; padding:20px;
  }

  .detail-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:20px; flex-wrap:wrap; gap:12px;
  }
  .dh-nome{ font-size:1.5rem; font-weight:800; }
  .dh-sub{ font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--muted); margin-top:2px; }

  .section{
    background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:20px 22px; margin-bottom:16px;
  }
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--line);
  }
  .section-title{
    font-size:.95rem; font-weight:800; display:flex; align-items:center; gap:8px;
  }
  .section-count{
    font-family:'JetBrains Mono',monospace; font-size:.68rem;
    background:var(--panel3); color:var(--muted); padding:2px 9px; border-radius:10px;
  }
  .btn-small{
    font-size:.72rem; font-weight:700; padding:7px 13px; border-radius:8px;
    background:var(--yellow-dim); border:1px solid rgba(250,204,21,.3); color:var(--yellow);
    cursor:pointer; font-family:'Syne',sans-serif;
  }
  .btn-small:hover{ filter:brightness(1.1); }

  .form-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
  .f-field{ display:flex; flex-direction:column; gap:6px; }
  .f-field.wide{ grid-column:1 / -1; }
  .f-label{
    font-size:.62rem; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.08em;
  }
  .f-input, .f-select, .f-textarea{
    padding:9px 11px; border-radius:8px; border:1.5px solid var(--line2);
    background:var(--panel2); color:var(--ink);
    font-family:'Syne',sans-serif; font-size:.82rem;
  }
  .f-textarea{ resize:vertical; min-height:60px; font-family:'JetBrains Mono',monospace; font-size:.78rem; }
  .f-input:focus, .f-select:focus, .f-textarea:focus{ outline:none; border-color:var(--yellow); }

  .btn-save{
    margin-top:16px; padding:11px 22px; border-radius:9px;
    background:var(--yellow); color:#161200; border:none;
    font-family:'Syne',sans-serif; font-weight:700; font-size:.82rem; cursor:pointer;
  }
  .btn-save:disabled{ opacity:.5; cursor:not-allowed; }
  .save-msg{ font-size:.72rem; margin-top:8px; display:none; font-weight:700; }
  .save-msg.ok{ color:#86efac; display:block; }
  .save-msg.err{ color:#fca5a5; display:block; }

  .record-list{ display:flex; flex-direction:column; gap:8px; }
  .record-item{
    background:var(--panel2); border:1px solid var(--line2); border-radius:10px;
    padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .ri-info{ font-size:.8rem; }
  .ri-title{ font-weight:700; margin-bottom:2px; }
  .ri-sub{ font-size:.7rem; color:var(--muted); font-family:'JetBrains Mono',monospace; }
  .ri-actions{ display:flex; gap:6px; flex-shrink:0; }
  .ri-btn{
    width:30px; height:30px; border-radius:7px; border:1px solid var(--line2);
    background:var(--panel3); color:var(--muted); cursor:pointer; font-size:.85rem;
    display:flex; align-items:center; justify-content:center;
  }
  .ri-btn:hover{ border-color:var(--yellow); color:var(--yellow); }
  .ri-btn.del:hover{ border-color:var(--red); color:#fca5a5; }
  .record-empty{ color:var(--dim); font-size:.78rem; font-family:'JetBrains Mono',monospace; padding:8px 0; }

  .modal-overlay{
    display:none; position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,.65); align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--panel2); border:1px solid var(--line2); border-radius:18px;
    padding:24px 26px; max-width:640px; width:100%;
    max-height:88dvh; overflow-y:auto;
  }
  .modal-title{ font-size:1.05rem; font-weight:800; margin-bottom:18px; }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn-cancel-modal{
    flex:1; padding:11px; border-radius:9px; border:1px solid var(--line2);
    background:transparent; color:var(--muted); font-family:'Syne',sans-serif;
    font-weight:700; font-size:.82rem; cursor:pointer;
  }
  .btn-cancel-modal:hover{ border-color:var(--muted); color:var(--ink); }
  .btn-confirm-modal{
    flex:2; padding:11px; border-radius:9px; border:none;
    background:var(--yellow); color:#161200; font-family:'Syne',sans-serif;
    font-weight:700; font-size:.82rem; cursor:pointer;
  }
  .btn-confirm-modal:disabled{ opacity:.5; cursor:not-allowed; }
  .modal-err{
    font-size:.78rem; color:#fca5a5; background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.3); border-radius:8px; padding:9px 12px;
    margin-bottom:14px; display:none;
  }
  .modal-err.visible{ display:block; }

  .spin-wrap{ text-align:center; padding:60px 20px; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:.82rem; }
  .spinner{
    width:28px; height:28px; border:3px solid var(--line2); border-top-color:var(--yellow);
    border-radius:50%; animation:spin .75s linear infinite; margin:0 auto 12px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="home.html">← Home</a>
  <div class="topbar-title">👤 Anagrafica Driver</div>
  <div class="topbar-right">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncLabel">Caricamento…</span>
    <span id="topClock">--:--:--</span>
  </div>
</div>

<div class="layout">
  <div class="col-left">
    <div class="search-box">
      <input class="search-input" id="searchInput" placeholder="🔍 Cerca driver…" oninput="filtraLista()">
    </div>
    <div class="driver-list" id="driverList">
      <div class="spin-wrap"><div class="spinner"></div>Caricamento driver…</div>
    </div>
  </div>

  <div class="col-right" id="colRight">
    <div class="empty-state">← Seleziona un driver dalla lista</div>
  </div>
</div>

<div class="modal-overlay" id="recordModal" onclick="if(event.target===this) chiudiRecordModal()">
  <div class="modal-box">
    <div class="modal-title" id="recordModalTitle">Nuovo record</div>
    <div class="modal-err" id="recordModalErr"></div>
    <div class="form-grid" id="recordModalFields"></div>
    <div class="modal-actions">
      <button class="btn-cancel-modal" onclick="chiudiRecordModal()">Annulla</button>
      <button class="btn-confirm-modal" id="recordModalSubmit" onclick="submitRecordModal()">Salva</button>
    </div>
  </div>
</div>

<script>
  function tick(){
    document.getElementById('topClock').textContent = new Date().toLocaleTimeString('it-IT');
  }
  tick(); setInterval(tick, 1000);

  // ── Config ────────────────────────────────────────────────
  const API       = 'https://giro.groupmylogistich.workers.dev';
  const ADMIN_KEY = 'mlg-admin-8f3k2q';

  function apiCall(qs, _retry) {
    return new Promise((resolve, reject) => {
      const cb    = '_cb' + Date.now() + Math.random().toString(36).slice(2);
      const tag   = document.createElement('script');
      const timer = setTimeout(() => {
        delete window[cb]; tag.remove();
        if (!_retry) { apiCall(qs, true).then(resolve).catch(reject); }
        else { reject(new Error('Timeout')); }
      }, 40000);
      window[cb] = data => { clearTimeout(timer); delete window[cb]; tag.remove(); resolve(data); };
      tag.onerror = () => {
        clearTimeout(timer); delete window[cb]; tag.remove();
        if (!_retry) { apiCall(qs, true).then(resolve).catch(reject); }
        else { reject(new Error('Errore di rete')); }
      };
      tag.src = API + '?' + qs + '&callback=' + cb;
      document.head.appendChild(tag);
    });
  }

  // ── Definizioni campi (generano i form automaticamente) ────
  const DRIVER_FIELDS = [
    { key:'Cognome Nome', label:'Cognome Nome', type:'text', wide:true },
    { key:'Stato Utente', label:'Stato Utente', type:'select', options:['ATTIVO','NON ATTIVO'] },
    { key:'Ruolo', label:'Ruolo', type:'select', options:['Driver','Admin','Office'] },
    { key:'Dipendente', label:'Dipendente', type:'text' },
    { key:'Stato', label:'Stato Operativo', type:'select', options:['Libero','Occupato'] },
    { key:'Email', label:'Email', type:'email' },
    { key:'Email_Driver', label:'Email Driver', type:'email' },
    { key:'Punti Patente Comunicati dal Driver', label:'Punti Patente', type:'number' },
    { key:'Contratto', label:'Contratto', type:'text' },
    { key:'Ore Contratto', label:'Ore Contratto', type:'number' },
  ];

  const DOC_FIELDS = [
    { key:'C_Identita', label:'Numero Carta Identità', type:'text' },
    { key:'C_Identita_Fronte', label:'C.I. Fronte (link)', type:'text' },
    { key:'C_Identita_Retro', label:'C.I. Retro (link)', type:'text' },
    { key:'C_Fiscale', label:'Codice Fiscale', type:'text' },
    { key:'C_Fiscale_Fronte', label:'C.F. Fronte (link)', type:'text' },
    { key:'C_Fiscale_Retro', label:'C.F. Retro (link)', type:'text' },
    { key:'Patente', label:'Numero Patente', type:'text' },
    { key:'Patente_scadenza', label:'Scadenza Patente', type:'date' },
    { key:'Patente_Punti', label:'Punti Patente', type:'number' },
    { key:'Patente_Fronte', label:'Patente Fronte (link)', type:'text' },
    { key:'Patente_Retro', label:'Patente Retro (link)', type:'text' },
    { key:'Lettere Richiamo', label:'Lettere Richiamo', type:'text' },
    { key:'Lettere Richiamo_Data', label:'Data Lettera Richiamo', type:'date' },
    { key:'Lettere Richiamo_Allegato 1', label:'Allegato 1 (link)', type:'text' },
    { key:'Lettere Richiamo_Allegato 2', label:'Allegato 2 (link)', type:'text' },
    { key:'Lettere Richiamo_Allegato 3', label:'Allegato 3 (link)', type:'text' },
    { key:'Varie', label:'Note Varie', type:'textarea', wide:true },
  ];

  const MULTA_FIELDS = [
    { key:'ID_Veicolo', label:'Veicolo (Targa)', type:'text' },
    { key:'Anno', label:'Anno', type:'number' },
    { key:'Data_Contravvenzione', label:'Data Contravvenzione', type:'date' },
    { key:'Importo', label:'Importo (€)', type:'number' },
    { key:'Motivo', label:'Motivo', type:'text', wide:true },
    { key:'Punti_Decurtati', label:'Punti Decurtati', type:'number' },
    { key:'Scadenza_Invio_Punti', label:'Scadenza Invio Punti', type:'date' },
    { key:'Invio Punti', label:'Invio Punti effettuato', type:'select', options:['','Si','No'] },
    { key:'Stato_Pagamento', label:'Stato Pagamento', type:'select', options:['Da Pagare','Pagata','Rateizzata'] },
    { key:'Stato_Addebito', label:'Stato Addebito', type:'select', options:['Da Addebitare','Addebitato','Non Addebitare'] },
    { key:'Importo_da_addebitare', label:'Importo da addebitare (€)', type:'number' },
    { key:'Allega_Multa', label:'Allegato (link)', type:'text' },
    { key:'Note', label:'Note', type:'textarea', wide:true },
  ];

  const SINISTRO_FIELDS = [
    { key:'Data Sinistro', label:'Data Sinistro', type:'date' },
    { key:'Ora', label:'Ora', type:'text' },
    { key:'Luogo', label:'Luogo', type:'text' },
    { key:'Veicolo', label:'Veicolo (Targa)', type:'text' },
    { key:'Descrizione', label:'Descrizione', type:'textarea', wide:true },
    { key:'Controparti', label:'Controparti', type:'text', wide:true },
    { key:'Foto', label:'Foto (link)', type:'text' },
    { key:'Documenti', label:'Documenti (link)', type:'text' },
    { key:'Modulo CAI', label:'Modulo CAI (link)', type:'text' },
    { key:'Preventivo', label:'Preventivo (link)', type:'text' },
    { key:'Perito', label:'Perito', type:'text' },
    { key:'Compagnia Assicurazione', label:'Compagnia Assicurazione', type:'text' },
    { key:'N° Sinistro Assicurazione', label:'N° Sinistro Assicurazione', type:'text' },
    { key:'Data Perizia', label:'Data Perizia', type:'date' },
    { key:'Responsabilità', label:'Responsabilità', type:'select', options:['','Nostra','Controparte','Concorsuale','Da Determinare'] },
    { key:'Percentuale Responsabilità (%)', label:'% Responsabilità', type:'number' },
    { key:'Riparatore', label:'Riparatore', type:'text' },
    { key:'Contatti Riparatore', label:'Contatti Riparatore', type:'text' },
    { key:'Data Consegna Riparatore', label:'Data Consegna Riparatore', type:'date' },
    { key:'Data Ritiro Veicolo', label:'Data Ritiro Veicolo', type:'date' },
    { key:'Costo Riparazione (€)', label:'Costo Riparazione (€)', type:'number' },
    { key:'Importo Danno (€)', label:'Importo Danno (€)', type:'number' },
    { key:'Importo Indennizzo Richiesto (€)', label:'Indennizzo Richiesto (€)', type:'number' },
    { key:'Importo Indennizzo Riconosciuto (€)', label:'Indennizzo Riconosciuto (€)', type:'number' },
    { key:'Data Richiesta Indennizzo', label:'Data Richiesta Indennizzo', type:'date' },
    { key:'Data Liquidazione', label:'Data Liquidazione', type:'date' },
    { key:'Stato Indennizzo', label:'Stato Indennizzo', type:'select', options:['','In Corso','Liquidato','Respinto'] },
    { key:'Stato Sinistro', label:'Stato Sinistro', type:'select', options:['Aperto','In Gestione','Chiuso'] },
    { key:'Data Chiusura', label:'Data Chiusura', type:'date' },
    { key:'Note Chiusura', label:'Note Chiusura', type:'textarea', wide:true },
    { key:'Feriti', label:'Feriti', type:'select', options:['No','Si'] },
    { key:'Forze Ordine', label:'Forze Ordine intervenute', type:'select', options:['No','Si'] },
    { key:'N° Verbale', label:'N° Verbale', type:'text' },
    { key:'Testimoni', label:'Testimoni', type:'text' },
    { key:'Franchigia (€)', label:'Franchigia (€)', type:'number' },
    { key:'Note Generali', label:'Note Generali', type:'textarea', wide:true },
  ];

  // ── Stato / cache globale — popolata da UNA sola chiamata iniziale ──
  let cacheDrivers      = [];   // array oggetti driver completi (riga Driver)
  let cacheAssenzeCount = {};   // { driverId: numero }
  let cacheDocumenti    = {};   // { driverId: oggetto documento }
  let cacheMulte        = {};   // { driverId: [oggetti multa] }
  let cacheSinistri     = {};   // { driverId: [oggetti sinistro] }
  let driverAttivo      = null;

  // ── Utility date dd/MM/yyyy <-> yyyy-MM-dd (per <input type=date>) ──
  function itToIso(s){
    if (!s || typeof s !== 'string' || !s.includes('/')) return '';
    const [d,m,y] = s.split('/');
    if (!d||!m||!y) return '';
    return y + '-' + m.padStart(2,'0') + '-' + d.padStart(2,'0');
  }
  function isoToIt(s){
    if (!s) return '';
    const [y,m,d] = s.split('-');
    if (!y||!m||!d) return s;
    return d + '/' + m + '/' + y;
  }

  // ── Caricamento MASSIVO unico all'apertura pagina ──
  async function caricaTutto(){
    document.getElementById('syncLabel').textContent = 'Caricamento…';
    document.getElementById('syncDot').classList.add('stale');
    try {
      const res = await apiCall('action=anagrafica_completa&key=' + encodeURIComponent(ADMIN_KEY));
      if (!res.ok) {
        document.getElementById('driverList').innerHTML = '<div class="spin-wrap">⚠️ ' + (res.errore||'Errore') + '<br><button class="btn-small" onclick="caricaTutto()">Riprova</button></div>';
        return;
      }
      cacheDrivers      = res.drivers || [];
      cacheAssenzeCount = res.assenzeCount || {};
      cacheDocumenti    = res.documenti || {};
      cacheMulte        = res.multe || {};
      cacheSinistri     = res.sinistri || {};
      renderListaDriver(cacheDrivers);
      document.getElementById('syncLabel').textContent = 'Aggiornato ' + new Date().toLocaleTimeString('it-IT');
      document.getElementById('syncDot').classList.remove('stale');
    } catch(e) {
      document.getElementById('driverList').innerHTML = '<div class="spin-wrap">⚠️ Impossibile caricare i driver.<br>' + e.message + '<br><button class="btn-small" onclick="caricaTutto()">Riprova</button></div>';
    }
  }

  function renderListaDriver(arr){
    const el = document.getElementById('driverList');
    if (!arr.length) { el.innerHTML = '<div class="spin-wrap">Nessun driver trovato.</div>'; return; }
    el.innerHTML = arr.map(d => {
      const id    = String(d['ID'] || '').trim();
      const nome  = d['Cognome Nome'] || '';
      const stato = d['Stato'] || '';
      const dip   = d['Dipendente'] || '';
      const badgeStato = stato === 'Occupato'
        ? '<span class="dc-badge occ">Occupato</span>'
        : '<span class="dc-badge lib">Libero</span>';
      const badgeDip = dip ? '<span class="dc-badge dip">' + dip + '</span>' : '';
      return '<div class="driver-card' + (driverAttivo === id ? ' active' : '') + '" onclick="selezionaDriver(\'' + id + '\')">' +
        '<div class="dc-top"><div class="dc-nome">' + nome + '</div><div class="dc-id">#' + id + '</div></div>' +
        '<div class="dc-badges">' + badgeStato + badgeDip + '</div>' +
      '</div>';
    }).join('');
  }

  function filtraLista(){
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) { renderListaDriver(cacheDrivers); return; }
    renderListaDriver(cacheDrivers.filter(d =>
      String(d['Cognome Nome']||'').toLowerCase().includes(q) || String(d['ID']||'').includes(q)
    ));
  }

  // ── Selezione driver — ISTANTANEA: legge solo dalla cache, zero rete ──
  function selezionaDriver(id){
    driverAttivo = id;
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    renderListaDriver(q ? cacheDrivers.filter(d => String(d['Cognome Nome']||'').toLowerCase().includes(q)) : cacheDrivers);
    renderDettaglio();
  }

  function driverCorrente(){
    return cacheDrivers.find(d => String(d['ID']).trim() === String(driverAttivo).trim());
  }

  // ── Generatore campi form ──
  function buildFormFields(fields, values, prefix){
    values = values || {};
    return fields.map(f => {
      const val = values[f.key] !== undefined ? values[f.key] : '';
      const id  = prefix + '_' + f.key.replace(/[^a-zA-Z0-9]/g,'_');
      let input = '';
      if (f.type === 'select') {
        input = '<select class="f-select" id="' + id + '" data-key="' + f.key.replace(/"/g,'&quot;') + '">' +
          f.options.map(o => '<option value="' + o + '"' + (o === val ? ' selected' : '') + '>' + (o || '—') + '</option>').join('') +
          '</select>';
      } else if (f.type === 'textarea') {
        input = '<textarea class="f-textarea" id="' + id + '" data-key="' + f.key.replace(/"/g,'&quot;') + '">' + (val||'') + '</textarea>';
      } else if (f.type === 'date') {
        input = '<input class="f-input" type="date" id="' + id + '" data-key="' + f.key.replace(/"/g,'&quot;') + '" data-type="date" value="' + itToIso(val) + '">';
      } else {
        input = '<input class="f-input" type="' + f.type + '" id="' + id + '" data-key="' + f.key.replace(/"/g,'&quot;') + '" value="' + String(val||'').replace(/"/g,'&quot;') + '">';
      }
      return '<div class="f-field' + (f.wide ? ' wide' : '') + '"><label class="f-label">' + f.label + '</label>' + input + '</div>';
    }).join('');
  }

  function leggiFormValues(containerId){
    const container = document.getElementById(containerId);
    const out = {};
    container.querySelectorAll('[data-key]').forEach(el => {
      let v = el.value;
      if (el.dataset.type === 'date') v = isoToIt(v);
      out[el.dataset.key] = v;
    });
    return out;
  }

  // ── Render pannello dettaglio (da cache, istantaneo) ──
  function renderDettaglio(){
    const d         = driverCorrente() || {};
    const id        = driverAttivo;
    const nAssenze  = cacheAssenzeCount[id] || 0;
    const documento = cacheDocumenti[id] || null;
    const multe     = cacheMulte[id] || [];
    const sinistri  = cacheSinistri[id] || [];

    const html = `
      <div class="detail-header">
        <div>
          <div class="dh-nome">${d['Cognome Nome'] || ''}</div>
          <div class="dh-sub">ID ${d['ID']||''} · ${nAssenze} assenze registrate</div>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><div class="section-title">📇 Anagrafica</div></div>
        <div class="form-grid" id="formDriver">${buildFormFields(DRIVER_FIELDS, d, 'drv')}</div>
        <button class="btn-save" onclick="salvaDriver()">💾 Salva Anagrafica</button>
        <div class="save-msg" id="msgDriver"></div>
      </div>

      <div class="section">
        <div class="section-head"><div class="section-title">📄 Documenti</div></div>
        <div class="form-grid" id="formDoc">${buildFormFields(DOC_FIELDS, documento || {}, 'doc')}</div>
        <button class="btn-save" onclick="salvaDocumento()">💾 Salva Documenti</button>
        <div class="save-msg" id="msgDoc"></div>
      </div>

      <div class="section">
        <div class="section-head">
          <div class="section-title">🚨 Multe <span class="section-count">${multe.length}</span></div>
          <button class="btn-small" onclick="apriRecordModal('multa')">＋ Aggiungi</button>
        </div>
        <div class="record-list" id="listaMulte"></div>
      </div>

      <div class="section">
        <div class="section-head">
          <div class="section-title">💥 Sinistri <span class="section-count">${sinistri.length}</span></div>
          <button class="btn-small" onclick="apriRecordModal('sinistro')">＋ Aggiungi</button>
        </div>
        <div class="record-list" id="listaSinistri"></div>
      </div>
    `;
    document.getElementById('colRight').innerHTML = html;
    renderListaMulte();
    renderListaSinistri();
  }

  function renderListaMulte(){
    const el = document.getElementById('listaMulte');
    const multe = cacheMulte[driverAttivo] || [];
    if (!multe.length) { el.innerHTML = '<div class="record-empty">Nessuna multa registrata.</div>'; return; }
    el.innerHTML = multe.map((m, i) => `
      <div class="record-item">
        <div class="ri-info">
          <div class="ri-title">${m['Motivo']||'—'} — ${m['Importo']?('€ '+m['Importo']):''}</div>
          <div class="ri-sub">${m['Data_Contravvenzione']||''} · ${m['ID_Veicolo']||''} · ${m['Stato_Pagamento']||''}</div>
        </div>
        <div class="ri-actions">
          <button class="ri-btn" onclick="apriRecordModal('multa', ${i})" title="Modifica">✎</button>
          <button class="ri-btn del" onclick="eliminaRecord('multa', '${m['ID_Multa']}')" title="Elimina">🗑</button>
        </div>
      </div>
    `).join('');
  }

  function renderListaSinistri(){
    const el = document.getElementById('listaSinistri');
    const sinistri = cacheSinistri[driverAttivo] || [];
    if (!sinistri.length) { el.innerHTML = '<div class="record-empty">Nessun sinistro registrato.</div>'; return; }
    el.innerHTML = sinistri.map((s, i) => `
      <div class="record-item">
        <div class="ri-info">
          <div class="ri-title">${s['Data Sinistro']||'—'} — ${s['Luogo']||''}</div>
          <div class="ri-sub">${s['Stato Sinistro']||''} · ${s['Compagnia Assicurazione']||''}</div>
        </div>
        <div class="ri-actions">
          <button class="ri-btn" onclick="apriRecordModal('sinistro', ${i})" title="Modifica">✎</button>
          <button class="ri-btn del" onclick="eliminaRecord('sinistro', '${s['ID Sinistro']}')" title="Elimina">🗑</button>
        </div>
      </div>
    `).join('');
  }

  // ── Salvataggio Anagrafica: scrive sul foglio, poi aggiorna la cache locale ──
  async function salvaDriver(){
    const campi = leggiFormValues('formDriver');
    const msg = document.getElementById('msgDriver');
    msg.className = 'save-msg'; msg.textContent = '';
    try {
      const res = await apiCall('action=driver_admin_update&driver=' + encodeURIComponent(driverAttivo) +
        '&campi=' + encodeURIComponent(JSON.stringify(campi)) + '&key=' + encodeURIComponent(ADMIN_KEY));
      if (res.ok) {
        msg.className = 'save-msg ok'; msg.textContent = '✓ Salvato.';
        const d = driverCorrente();
        if (d) Object.assign(d, campi);
        renderListaDriver(cacheDrivers);
      } else {
        msg.className = 'save-msg err'; msg.textContent = '⚠️ ' + (res.errore || 'Errore salvataggio.');
      }
    } catch(e) {
      msg.className = 'save-msg err'; msg.textContent = '⚠️ Errore di connessione.';
    }
  }

  // ── Salvataggio Documenti ──
  async function salvaDocumento(){
    const campi = leggiFormValues('formDoc');
    const msg = document.getElementById('msgDoc');
    msg.className = 'save-msg'; msg.textContent = '';
    try {
      const res = await apiCall('action=documento_upsert&driver=' + encodeURIComponent(driverAttivo) +
        '&campi=' + encodeURIComponent(JSON.stringify(campi)) + '&key=' + encodeURIComponent(ADMIN_KEY));
      if (res.ok) {
        msg.className = 'save-msg ok'; msg.textContent = '✓ Salvato.';
        cacheDocumenti[driverAttivo] = Object.assign({}, cacheDocumenti[driverAttivo] || {}, campi);
      } else {
        msg.className = 'save-msg err'; msg.textContent = '⚠️ ' + (res.errore || 'Errore salvataggio.');
      }
    } catch(e) {
      msg.className = 'save-msg err'; msg.textContent = '⚠️ Errore di connessione.';
    }
  }

  // ── Modal generico Multa / Sinistro ──
  let recordModalTipo = null;   // 'multa' | 'sinistro'
  let recordModalIdx  = null;   // indice nell'array cache (null = nuovo)

  function apriRecordModal(tipo, idx){
    recordModalTipo = tipo;
    recordModalIdx  = (idx !== undefined) ? idx : null;
    const fields = tipo === 'multa' ? MULTA_FIELDS : SINISTRO_FIELDS;
    const arr    = tipo === 'multa' ? (cacheMulte[driverAttivo]||[]) : (cacheSinistri[driverAttivo]||[]);
    const values = (recordModalIdx !== null) ? arr[recordModalIdx] : {};
    document.getElementById('recordModalTitle').textContent =
      (recordModalIdx !== null ? 'Modifica ' : 'Nuova ') + (tipo === 'multa' ? 'Multa' : 'Sinistro');
    document.getElementById('recordModalFields').innerHTML = buildFormFields(fields, values, 'rec');
    document.getElementById('recordModalErr').classList.remove('visible');
    document.getElementById('recordModal').classList.add('open');
  }

  function chiudiRecordModal(){
    document.getElementById('recordModal').classList.remove('open');
    recordModalTipo = null; recordModalIdx = null;
  }

  async function submitRecordModal(){
    const campi = leggiFormValues('recordModalFields');
    const errEl = document.getElementById('recordModalErr');
    errEl.classList.remove('visible');
    document.getElementById('recordModalSubmit').disabled = true;
    try {
      let res;
      const idField = recordModalTipo === 'multa' ? 'ID_Multa' : 'ID Sinistro';
      const arr     = recordModalTipo === 'multa'
        ? (cacheMulte[driverAttivo] || (cacheMulte[driverAttivo] = []))
        : (cacheSinistri[driverAttivo] || (cacheSinistri[driverAttivo] = []));

      if (recordModalIdx !== null) {
        const id = arr[recordModalIdx][idField];
        const action = recordModalTipo === 'multa' ? 'multa_update' : 'sinistro_update';
        res = await apiCall('action=' + action + '&id=' + encodeURIComponent(id) +
          '&campi=' + encodeURIComponent(JSON.stringify(campi)) + '&key=' + encodeURIComponent(ADMIN_KEY));
        if (res.ok) Object.assign(arr[recordModalIdx], campi);
      } else {
        const action = recordModalTipo === 'multa' ? 'multa_add' : 'sinistro_add';
        res = await apiCall('action=' + action + '&driver=' + encodeURIComponent(driverAttivo) +
          '&campi=' + encodeURIComponent(JSON.stringify(campi)) + '&key=' + encodeURIComponent(ADMIN_KEY));
        if (res.ok) {
          const nuovoRecord = Object.assign({}, campi);
          nuovoRecord[idField] = res.id;
          arr.push(nuovoRecord);
        }
      }
      document.getElementById('recordModalSubmit').disabled = false;
      if (res.ok) {
        chiudiRecordModal();
        renderDettaglio();
      } else {
        errEl.textContent = '⚠️ ' + (res.errore || 'Errore salvataggio.');
        errEl.classList.add('visible');
      }
    } catch(e) {
      document.getElementById('recordModalSubmit').disabled = false;
      errEl.textContent = '⚠️ Errore di connessione.';
      errEl.classList.add('visible');
    }
  }

  async function eliminaRecord(tipo, id){
    if (!confirm('Eliminare questo ' + (tipo === 'multa' ? 'verbale' : 'sinistro') + '? Operazione non reversibile.')) return;
    const action = tipo === 'multa' ? 'multa_delete' : 'sinistro_delete';
    try {
      const res = await apiCall('action=' + action + '&id=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(ADMIN_KEY));
      if (res.ok) {
        const idField = tipo === 'multa' ? 'ID_Multa' : 'ID Sinistro';
        const arr = tipo === 'multa' ? cacheMulte[driverAttivo] : cacheSinistri[driverAttivo];
        if (arr) {
          const idx = arr.findIndex(r => r[idField] === id);
          if (idx >= 0) arr.splice(idx, 1);
        }
        renderDettaglio();
      } else {
        alert(res.errore || 'Errore eliminazione.');
      }
    } catch(e) { alert('Errore di connessione.'); }
  }

  caricaTutto();
</script>
